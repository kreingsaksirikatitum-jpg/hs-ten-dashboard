<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HS-TEN Maintenance Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f7f2ff,#eef5ff 50%,#fff9e8);color:#18223b}.wrap{max-width:1700px;margin:auto;padding:20px}.hero{background:linear-gradient(115deg,#31105f,#6631a1 62%,#a05ec3);color:white;border-radius:26px;padding:28px 30px}.hero h1{margin:5px 0;font-size:40px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 28px #2a33500d}.value{font-size:38px;font-weight:900}.green{color:#07815c}.amber{color:#a66c00}.purple{color:#5d2b91}.toolbar{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:9px}input,select,button{height:42px;border:1px solid #d9ddeb;border-radius:11px;padding:0 12px;background:white}.chips{display:flex;gap:8px;margin-top:12px}.chip{border:0;height:34px;background:#f2eaff;color:#5d2b91;font-weight:bold}.chip.active{background:#5d2b91;color:white}.tablebox{margin-top:14px;background:#fff;border-radius:20px;overflow:auto;max-height:68vh}table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f5;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#4d237c;color:white;cursor:pointer}tr:hover td{background:#fff8dc}.status{font-weight:bold;padding:3px 8px;border-radius:12px}.TECO{background:#dff7ed;color:#087754}.REL{background:#fff0c6;color:#936100}@media(max-width:950px){.kpis{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><section class="hero"><b>THAI AIRWAYS • BASE MAINTENANCE</b><h1>HS‑TEN Maintenance Dashboard</h1><div>C10(24M)+MOD • 05 SEP 2026 • Interactive Work Order Explorer</div></section><section class="kpis"><div class="card"><b>TOTAL WORK ITEMS</b><div class="value purple" id="total">1,615</div></div><div class="card"><b>TECO</b><div class="value green" id="teco">1,530</div><b>94.74%</b></div><div class="card"><b>REL</b><div class="value amber" id="rel">85</div><b>5.26%</b></div></section><section class="card"><div class="toolbar"><input id="q" placeholder="ค้นหาทุก Column / Order / Description..."><select id="col"><option value="">เลือก Column เพื่อกรอง</option></select><select id="val"><option value="">ค่าทั้งหมด</option></select><select id="wc"><option value="">All Work Center</option></select><select id="wg"><option value="">All Working Group</option></select><button id="clear">Clear Filter</button><b id="count"></b></div><div class="chips"><button class="chip active" data-s="">ALL</button><button class="chip" data-s="TECO">TECO</button><button class="chip" data-s="REL">REL</button></div></section><div class="tablebox"><table><thead><tr id="head"></tr></thead><tbody id="body"><tr><td>กำลังโหลดข้อมูลจาก Excel HS-TEN...</td></tr></tbody></table></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>let H=[],D=[],status='',sort=-1,asc=1,$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));function ix(n){return H.indexOf(n)}function fill(id,n){let i=ix(n);if(i<0)return;[...new Set(D.map(r=>r[i]).filter(Boolean))].sort().forEach(v=>$(id).add(new Option(v,v)))}function colvals(){let i=$('col').value;$('val').innerHTML='<option value="">ค่าทั้งหมด</option>';if(i==='')return render();[...new Set(D.map(r=>r[+i]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).forEach(v=>$('val').add(new Option(v,v)));render()}function render(){let q=$('q').value.toLowerCase(),ci=$('col').value,cv=$('val').value,wci=ix('Oper.WorkCenter'),wgi=ix('Working Group'),si=ix('Syste');let V=D.filter(r=>(!status||r[si]===status)&&(!$('wc').value||r[wci]===$('wc').value)&&(!$('wg').value||r[wgi]===$('wg').value)&&(ci===''||!cv||r[+ci]===cv)&&(!q||r.some(v=>String(v).toLowerCase().includes(q))));if(sort>=0)V.sort((a,b)=>String(a[sort]??'').localeCompare(String(b[sort]??''),undefined,{numeric:true})*asc);$('count').textContent='Showing '+V.length.toLocaleString()+' / '+D.length.toLocaleString();$('body').innerHTML=V.map(r=>'<tr>'+r.map((v,i)=>'<td title="'+esc(v)+'">'+(i===si?'<span class="status '+esc(v)+'">'+esc(v)+'</span>':esc(v))+'</td>').join('')+'</tr>').join('')}async function boot(){let res=await fetch('Excel%20HS-TEN.xlsx?v='+Date.now());let ab=await res.arrayBuffer(),wb=XLSX.read(ab,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});while(rows.length&&rows[0].every(x=>!x))rows.shift();let hi=rows.findIndex(r=>r.some(x=>String(x).trim()==='Item')&&r.some(x=>String(x).includes('Order')));if(hi<0)hi=6;H=rows[hi].map((x,i)=>String(x||('Column '+(i+1))).trim());D=rows.slice(hi+1).filter(r=>r.some(Boolean)).map(r=>H.map((_,i)=>String(r[i]??'')));$('head').innerHTML=H.map((h,i)=>'<th data-i="'+i+'">'+esc(h)+' ↕</th>').join('');H.forEach((h,i)=>$('col').add(new Option(h,i)));fill('wc','Oper.WorkCenter');fill('wg','Working Group');document.querySelectorAll('th').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(sort===i)asc*=-1;else{sort=i;asc=1}render()});['q','val','wc','wg'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));$('col').onchange=colvals;$('clear').onclick=()=>{$('q').value='';$('col').value='';$('val').innerHTML='<option value="">ค่าทั้งหมด</option>';$('wc').value='';$('wg').value='';status='';document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.s===''));render()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{status=b.dataset.s;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});render()}boot().catch(e=>$('body').innerHTML='<tr><td>โหลดข้อมูลไม่สำเร็จ กรุณากด Refresh</td></tr>');</script></body></html>
